{%- comment -%} Uso: {% include figure.html src="flota/x.jpg" alt="..." caption="..." %} {%- endcomment -%}
<figure data-lightbox><img src="{{ '/assets/img/' | append: include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy" width="800" height="600">{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>
