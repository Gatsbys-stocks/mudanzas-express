{%- comment -%} Uso: {% include figure.html src="flota/x.webp" alt="..." caption="..." %}  (x.webp = grande, x-640.webp = pequena) {%- endcomment -%}
{%- assign big = '/assets/img/' | append: include.src | relative_url -%}
{%- assign small = big | replace: '.webp', '-640.webp' -%}
<figure data-lightbox><img src="{{ big }}" srcset="{{ small }} 640w, {{ big }} 1200w" sizes="(min-width:900px) 560px, 92vw" alt="{{ include.alt }}" loading="lazy" width="1200" height="900">{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>
