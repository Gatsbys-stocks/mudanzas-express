<section class="section">
  <div class="wrap narrow">
    <div class="sec-head">
      <p class="eyebrow">Preguntas frecuentes</p>
      <h2>Lo que más nos preguntan</h2>
    </div>
    <div class="faq">
      {%- for item in site.data.faq %}
      <details{% if forloop.first %} open{% endif %}>
        <summary>{{ item.q }}</summary>
        <p>{{ item.a }}</p>
      </details>
      {%- endfor %}
    </div>
  </div>
</section>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for item in site.data.faq %}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}
</script>
