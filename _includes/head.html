{%- assign site_name = site.data.site.name -%}
{%- capture full_title -%}{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }} | {{ site_name }}{% endif %}{%- endcapture -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ full_title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#0f2742">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"MovingCompany","name":"{{ site_name }}","url":"{{ site.url }}","areaServed":["España","Francia","Alemania","Portugal"],"address":{"@type":"PostalAddress","addressLocality":"{{ site.data.site.base_city }}","addressCountry":"ES"},"description":"Mudanzas de pisos, casas, oficinas y empresas en toda España y a Francia, Alemania y Portugal."}
</script>
