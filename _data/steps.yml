- { title: Escríbenos por WhatsApp, text: "Pulsa el botón y cuéntanos qué vas a mudar, desde dónde, hacia dónde y para cuándo." }
- { title: Recibe tu presupuesto, text: Te respondemos con la información necesaria y el presupuesto de tu mudanza. }
- { title: Nos encargamos del resto, text: "Acordamos el día y nuestro equipo, con su camión, se ocupa del traslado." }
