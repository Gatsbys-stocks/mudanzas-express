- q: ¿Cómo puedo pedir presupuesto?
  a: Escríbenos por WhatsApp con el origen, el destino, la fecha aproximada y el tipo de vivienda u oficina. También puedes usar el formulario de la web, que abre WhatsApp con tus datos ya escritos.
- q: ¿En qué zonas trabajáis?
  a: En toda España, con base en Barcelona. Además realizamos mudanzas internacionales a Francia, Alemania y Portugal.
- q: ¿Hacéis mudanzas de oficinas y empresas?
  a: Sí. Trasladamos oficinas, locales y empresas, además de pisos, casas y todo tipo de viviendas.
- q: ¿Podéis desmontar y montar los muebles?
  a: Sí. Desmontamos los muebles antes de cargarlos y los montamos de nuevo en el destino.
- q: ¿Hacéis vaciados de pisos y locales?
  a: Sí. Vaciamos pisos, casas, oficinas y locales. Nuestro personal puede ayudar con la carga, la descarga y la retirada de los objetos que corresponda.
- q: ¿Puedo contratar solo el transporte de unos muebles o electrodomésticos?
  a: Sí. Además de la mudanza completa, transportamos muebles y electrodomésticos de un punto a otro.
